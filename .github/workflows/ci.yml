name: CI

on:
  push:
    branches: ["master"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Determines whether any changed file requires running tests
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          # `relevant` is true if any changed file is outside the ignore set
          predicate-quantifier: every
          filters: |
            relevant:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE*'
              - '!.gitignore'
              - '!.github/workflows/release.yml'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          components: rustfmt, clippy

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::pedantic

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

      - uses: taiki-e/install-action@2a864fa5714510ad0573d2f22ecd17bce6156699 # nextest

      - name: Test
        run: cargo nextest run

  bench:
    name: Bench (iai-callgrind)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - uses: taiki-e/install-action@2a864fa5714510ad0573d2f22ecd17bce6156699 # iai-callgrind-runner
        with:
          tool: iai-callgrind-runner@0.14

      - name: Restore iai-callgrind baseline
        id: baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target/iai
          key: iai-${{ runner.os }}-master-${{ github.sha }}
          restore-keys: |
            iai-${{ runner.os }}-master-

      - name: Seed baseline from master
        if: |
          github.event_name == 'pull_request' &&
          steps.baseline.outputs.cache-matched-key == ''
        run: |
          echo "No baseline cache; running iai on master to seed the comparison."
          original=$(git rev-parse HEAD)
          git fetch --depth=1 origin master
          git -c advice.detachedHead=false checkout FETCH_HEAD
          cargo bench --bench iai_lib -- --save-baseline=master
          git -c advice.detachedHead=false checkout "$original"

      - name: Compare benches against master (advisory)
        if: github.event_name == 'pull_request'
        env:
          IAI_CALLGRIND_REGRESSION: "ir=5.0"
        run: |
          cargo bench --bench iai_lib -- --baseline=master && status=0 || status=$?
          # Exit 3 is iai-callgrind flagging a regression: advisory, stay green.
          # Any other non-zero means the benches failed to build or run.
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            echo "::error::iai-callgrind failed to run (exit $status)"
            exit "$status"
          fi

      - name: Record master baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: cargo bench --bench iai_lib -- --save-baseline=master

      - name: Save iai-callgrind baseline (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target/iai
          key: iai-${{ runner.os }}-master-${{ github.sha }}

  # Runs unconditionally so this required check can't deadlock on a skipped matrix job.
  # Passes when every job succeeded or was skipped.
  ci:
    name: All checks passed
    needs: [changes, lint, test, bench]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.test.result }}
          BENCH: ${{ needs.bench.result }}
        run: |
          echo "changes=$CHANGES lint=$LINT test=$TESTS bench=$BENCH"
          # Change detection must pass
          [ "$CHANGES" = "success" ] || { echo "::error::change detection $CHANGES"; exit 1; }
          for job in lint:"$LINT" test:"$TESTS" bench:"$BENCH"; do
            case "${job#*:}" in
              success | skipped) ;;
              *) echo "::error::${job%%:*} ${job#*:}"; exit 1 ;;
            esac
          done
